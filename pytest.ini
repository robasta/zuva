[pytest]
# pythonpath makes the three top-level packages importable, so tests no longer
# need PYTHONPATH=. or a per-file sys.path.insert.
pythonpath = .
testpaths = tests
asyncio_mode = strict
addopts = -ra
filterwarnings =
    # influxdb-client and reactivex still call datetime.utcfromtimestamp().
    ignore:datetime.datetime.utcfromtimestamp\(\) is deprecated:DeprecationWarning
