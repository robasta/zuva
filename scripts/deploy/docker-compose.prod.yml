services:
  # InfluxDB for data storage
  influxdb:
    image: influxdb:2.7
    container_name: sunsynk-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=sunsynk-admin-password
      - DOCKER_INFLUXDB_INIT_ORG=sunsynk
      - DOCKER_INFLUXDB_INIT_BUCKET=solar_data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=sunsynk-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - sunsynk-network

  # Zuva API Service (Docker Hub image)
  zuva-api:
    image: robasta/zuva-api:latest
    platform: linux/amd64
    container_name: zuva-api
    restart: unless-stopped
    command: ["uvicorn", "zuva_api.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    environment:
      - API_PORT=8001
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=sunsynk-token
      - INFLUXDB_ORG=sunsynk
      - INFLUXDB_BUCKET=solar_data
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - DEFAULT_USER_ID=${DEFAULT_USER_ID}
    depends_on:
      influxdb:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sunsynk-network

  # Alert Monitor Service (Docker Hub image)
  alert-monitor:
    image: robasta/zuva:latest
    platform: linux/amd64
    container_name: zuva
    restart: unless-stopped
    environment:
      - SUNSYNK_USERNAME=${SUNSYNK_USERNAME}
      - SUNSYNK_PASSWORD=${SUNSYNK_PASSWORD}
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=sunsynk-token
      - INFLUXDB_ORG=sunsynk
      - INFLUXDB_BUCKET=solar_data
      - NOTIFICATION_API_URL=http://zuva-api:8001
      - DEFAULT_USER_ID=${DEFAULT_USER_ID}
      - POLL_INTERVAL=${POLL_INTERVAL:-600}
      - BATTERY_LOW_THRESHOLD=${BATTERY_LOW_THRESHOLD:-20}
      - BATTERY_CRITICAL_THRESHOLD=${BATTERY_CRITICAL_THRESHOLD:-15}
      - HIGH_CONSUMPTION_THRESHOLD=${HIGH_CONSUMPTION_THRESHOLD:-400}
    depends_on:
      influxdb:
        condition: service_started
      zuva-api:
        condition: service_healthy
    networks:
      - sunsynk-network

networks:
  sunsynk-network:
    driver: bridge

volumes:
  influxdb_data:
  influxdb_config:
