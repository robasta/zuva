# Production stack, uploaded by hand to Portainer.
#
# Set these three in the Portainer stack's environment section - the deploy
# fails with the message below if any is missing, rather than silently starting
# with a well-known secret:
#   ZUVA_API_KEY, SUNSYNK_USERNAME, SUNSYNK_PASSWORD
# Optional: ZUVA_VERSION (image tag), TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
#   TIMEZONE, POLL_INTERVAL, HISTORY_RETENTION_DAYS, the alert thresholds.
#
# Two containers, no database service: zuva-api keeps everything in one SQLite
# file on the zuva_api_data volume, so that volume is the whole backup.
services:
  # Zuva API Service (Docker Hub image) - owns the only database
  zuva-api:
    image: robasta/zuva-api:${ZUVA_VERSION:-latest}
    platform: linux/amd64
    container_name: zuva-api
    restart: unless-stopped
    environment:
      - API_PORT=8001
      - UVICORN_LOG_LEVEL=${UVICORN_LOG_LEVEL:-warning}
      # These endpoints can redirect where alerts are delivered and can send
      # messages, so the service refuses to start unauthenticated. Use a long
      # random string; the collector must send the same value.
      - ZUVA_API_KEY=${ZUVA_API_KEY:?set ZUVA_API_KEY in the stack environment}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Alerts and readings are pruned in-process on a periodic sweep; without a
      # retention window the SQLite file grows for as long as the stack runs.
      # 0 keeps everything.
      - HISTORY_RETENTION_DAYS=${HISTORY_RETENTION_DAYS:-90}
      # TZ for log timestamps, TIMEZONE for quiet-hours arithmetic. Containers
      # default to UTC, which shifts quiet hours by two hours in SAST.
      - TZ=${TIMEZONE:-Africa/Johannesburg}
      - TIMEZONE=${TIMEZONE:-Africa/Johannesburg}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - DEFAULT_USER_ID=${DEFAULT_USER_ID:-robasta}
    ports:
      - "8001:8001"
    volumes:
      # Settings, rate-limit state, alert history and readings - one SQLite file.
      # Without this volume a redeploy forgets which chat to notify.
      - zuva_api_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sunsynk-network

  # Alert Monitor Service (Docker Hub image)
  alert-monitor:
    image: robasta/zuva:${ZUVA_VERSION:-latest}
    platform: linux/amd64
    container_name: zuva
    restart: unless-stopped
    environment:
      - SUNSYNK_USERNAME=${SUNSYNK_USERNAME:?set SUNSYNK_USERNAME in the stack environment}
      - SUNSYNK_PASSWORD=${SUNSYNK_PASSWORD:?set SUNSYNK_PASSWORD in the stack environment}
      - LOG_LEVEL=${LOG_LEVEL:-WARN}
      # The collector stores nothing itself: alerts and telemetry both go here,
      # which is why it needs no database credentials.
      - NOTIFICATION_API_URL=http://zuva-api:8001
      # Must match zuva-api's ZUVA_API_KEY or every post is rejected with 401.
      - ZUVA_API_KEY=${ZUVA_API_KEY}
      - TZ=${TIMEZONE:-Africa/Johannesburg}
      - TIMEZONE=${TIMEZONE:-Africa/Johannesburg}
      - DEFAULT_USER_ID=${DEFAULT_USER_ID:-robasta}
      - POLL_INTERVAL=${POLL_INTERVAL:-600}
      - BATTERY_LOW_THRESHOLD=${BATTERY_LOW_THRESHOLD:-20}
      - BATTERY_CRITICAL_THRESHOLD=${BATTERY_CRITICAL_THRESHOLD:-15}
      # Thresholds are in watts; the _W suffix is the current name. The old
      # HIGH_CONSUMPTION_THRESHOLD / EVENING_CONSUMPTION_THRESHOLD names still
      # work but log a deprecation warning.
      - HIGH_CONSUMPTION_THRESHOLD_W=${HIGH_CONSUMPTION_THRESHOLD_W:-400}
      - EVENING_CONSUMPTION_THRESHOLD_W=${EVENING_CONSUMPTION_THRESHOLD_W:-900}
      - GRID_OUTAGE_CONSECUTIVE_READINGS=${GRID_OUTAGE_CONSECUTIVE_READINGS:-3}
      - GRID_VOLTAGE_THRESHOLD=${GRID_VOLTAGE_THRESHOLD:-50}
      - GRID_OUTAGE_COOLDOWN_MINUTES=${GRID_OUTAGE_COOLDOWN_MINUTES:-30}
      # Depletion projection: warn before the low threshold is reached, from the
      # observed rate of SoC decline. 0 for the horizon disables the check.
      - BATTERY_DEPLETION_HORIZON_MINUTES=${BATTERY_DEPLETION_HORIZON_MINUTES:-120}
      - BATTERY_DEPLETION_URGENT_MINUTES=${BATTERY_DEPLETION_URGENT_MINUTES:-60}
      - BATTERY_DEPLETION_CONSECUTIVE_READINGS=${BATTERY_DEPLETION_CONSECUTIVE_READINGS:-2}
      - BATTERY_SOC_WINDOW_MINUTES=${BATTERY_SOC_WINDOW_MINUTES:-45}
      - BATTERY_DEPLETION_MIN_SPAN_MINUTES=${BATTERY_DEPLETION_MIN_SPAN_MINUTES:-20}
      - BATTERY_DEPLETION_MIN_RATE_PCT_PER_HOUR=${BATTERY_DEPLETION_MIN_RATE_PCT_PER_HOUR:-1.0}
      - LOGIN_RETRY_WAIT_SECONDS=${LOGIN_RETRY_WAIT_SECONDS:-900}
      - AUTH_FAILURE_BACKOFF_SECONDS=${AUTH_FAILURE_BACKOFF_SECONDS:-21600}
    volumes:
      # Alert suppression state, so a redeploy does not re-send every alert.
      - collector_state:/data
    depends_on:
      zuva-api:
        condition: service_healthy
    healthcheck:
      # The monitor listens on no port. It touches a heartbeat file after each
      # completed poll, so this catches a wedged poll loop in a live process.
      test: ["CMD", "python", "-m", "collector.heartbeat"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - sunsynk-network

networks:
  sunsynk-network:
    driver: bridge

volumes:
  zuva_api_data:
  collector_state:
