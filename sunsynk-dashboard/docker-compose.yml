services:
  # InfluxDB for data storage
  influxdb:
    image: influxdb:2.7
    container_name: sunsynk-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=sunsynk-admin-password
      - DOCKER_INFLUXDB_INIT_ORG=sunsynk
      - DOCKER_INFLUXDB_INIT_BUCKET=solar_data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=sunsynk-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - sunsynk-network

  # Notification API Service
  notification-api:
    build:
      context: .
      dockerfile: notification_service/Dockerfile
    container_name: sunsynk-notification-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=sunsynk-token
      - INFLUXDB_ORG=sunsynk
      - INFLUXDB_BUCKET=solar_data
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    depends_on:
      - influxdb
    networks:
      - sunsynk-network

  # Alert Monitor Service
  alert-monitor:
    build:
      context: ..
      dockerfile: sunsynk-dashboard/collector/Dockerfile
    container_name: sunsynk-alert-monitor
    restart: unless-stopped
    environment:
      - SUNSYNK_USERNAME=${SUNSYNK_USERNAME}
      - SUNSYNK_PASSWORD=${SUNSYNK_PASSWORD}
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=sunsynk-token
      - INFLUXDB_ORG=sunsynk
      - INFLUXDB_BUCKET=solar_data
      - NOTIFICATION_API_URL=http://notification-api:8000
      - POLL_INTERVAL=${POLL_INTERVAL:-60}
      - BATTERY_LOW_THRESHOLD=${BATTERY_LOW_THRESHOLD:-20}
      - BATTERY_CRITICAL_THRESHOLD=${BATTERY_CRITICAL_THRESHOLD:-15}
      - HIGH_CONSUMPTION_THRESHOLD=${HIGH_CONSUMPTION_THRESHOLD:-0.8}
    depends_on:
      - influxdb
      - notification-api
    volumes:
      - ../sunsynk:/app/sunsynk
    networks:
      - sunsynk-network

networks:
  sunsynk-network:
    driver: bridge

volumes:
  influxdb_data:
  influxdb_config: