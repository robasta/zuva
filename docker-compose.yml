# Local development stack: builds both images from this checkout.
# For the deployed stack see scripts/deploy/docker-compose.prod.yml, which pulls
# published images and requires every secret to be supplied.
services:
  # Zuva API Service - owns the only database (SQLite on zuva_api_data)
  zuva-api:
    build:
      context: .
      dockerfile: zuva_api/Dockerfile
    container_name: zuva-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - API_PORT=8001
      - UVICORN_LOG_LEVEL=${UVICORN_LOG_LEVEL:-warning}
      # The service refuses to start without this, and the collector must send
      # the same value as X-API-Key. Dev default; set a real one anywhere else.
      - ZUVA_API_KEY=${ZUVA_API_KEY:-dev-local-key}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Alerts and readings are swept in-process; 0 keeps everything.
      - HISTORY_RETENTION_DAYS=${HISTORY_RETENTION_DAYS:-90}
      # TZ for log timestamps, TIMEZONE for quiet-hours arithmetic.
      - TZ=${TIMEZONE:-Africa/Johannesburg}
      - TIMEZONE=${TIMEZONE:-Africa/Johannesburg}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - DEFAULT_USER_ID=${DEFAULT_USER_ID:-robasta}
    volumes:
      # The one SQLite file: settings, rate-limit state, alert history, readings.
      - zuva_api_data:/data
    networks:
      - sunsynk-network

  # Alert Monitor Service
  alert-monitor:
    build:
      context: .
      dockerfile: zuva/collector/Dockerfile
    container_name: zuva
    restart: unless-stopped
    environment:
      - SUNSYNK_USERNAME=${SUNSYNK_USERNAME}
      - SUNSYNK_PASSWORD=${SUNSYNK_PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL:-WARN}
      # The collector stores nothing itself: alerts and telemetry both go here.
      - NOTIFICATION_API_URL=http://zuva-api:8001
      # Must match zuva-api's ZUVA_API_KEY or every post is rejected with 401.
      - ZUVA_API_KEY=${ZUVA_API_KEY:-dev-local-key}
      - TZ=${TIMEZONE:-Africa/Johannesburg}
      - TIMEZONE=${TIMEZONE:-Africa/Johannesburg}
      - DEFAULT_USER_ID=${DEFAULT_USER_ID:-robasta}
      - POLL_INTERVAL=${POLL_INTERVAL:-600}
      - BATTERY_LOW_THRESHOLD=${BATTERY_LOW_THRESHOLD:-20}
      - BATTERY_CRITICAL_THRESHOLD=${BATTERY_CRITICAL_THRESHOLD:-15}
      # Thresholds are in watts; the _W suffix is the current name.
      - HIGH_CONSUMPTION_THRESHOLD_W=${HIGH_CONSUMPTION_THRESHOLD_W:-400}
      - EVENING_CONSUMPTION_THRESHOLD_W=${EVENING_CONSUMPTION_THRESHOLD_W:-900}
      - GRID_OUTAGE_CONSECUTIVE_READINGS=${GRID_OUTAGE_CONSECUTIVE_READINGS:-3}
      - GRID_VOLTAGE_THRESHOLD=${GRID_VOLTAGE_THRESHOLD:-50}
      - GRID_OUTAGE_COOLDOWN_MINUTES=${GRID_OUTAGE_COOLDOWN_MINUTES:-30}
    depends_on:
      zuva-api:
        condition: service_healthy
    volumes:
      # Live-edit the client without rebuilding; the image installs it from here.
      - ./sunsynk:/app/sunsynk
      # Alert suppression state, so a restart does not re-send every alert.
      - collector_state:/data
    networks:
      - sunsynk-network

networks:
  sunsynk-network:
    driver: bridge

volumes:
  zuva_api_data:
  collector_state:
