name: Release

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - 'release/*'
    types:
      - completed

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        fetch-depth: 0
        fetch-tags: true

    - name: Set release tags
      id: tags
      run: |
        version="${{ github.event.workflow_run.head_branch }}"
        version="${version#release/}"
        short_sha="${{ github.event.workflow_run.head_sha }}"
        short_sha="${short_sha::7}"
        echo "version_tag=$version" >> "$GITHUB_OUTPUT"
        echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push alert-monitor image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: zuva/collector/Dockerfile
        platforms: linux/amd64
        push: true
        tags: |
          ${{ env.DOCKERHUB_NAMESPACE }}/zuva:latest
          ${{ env.DOCKERHUB_NAMESPACE }}/zuva:${{ steps.tags.outputs.version_tag }}
          ${{ env.DOCKERHUB_NAMESPACE }}/zuva:${{ steps.tags.outputs.version_tag }}-${{ steps.tags.outputs.short_sha }}

    - name: Build and push zuva-api image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: zuva_api/Dockerfile
        platforms: linux/amd64
        push: true
        tags: |
          ${{ env.DOCKERHUB_NAMESPACE }}/zuva-api:latest
          ${{ env.DOCKERHUB_NAMESPACE }}/zuva-api:${{ steps.tags.outputs.version_tag }}
          ${{ env.DOCKERHUB_NAMESPACE }}/zuva-api:${{ steps.tags.outputs.version_tag }}-${{ steps.tags.outputs.short_sha }}
