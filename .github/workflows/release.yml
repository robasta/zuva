name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install venv and dependencies
      run: ./scripts/setup.sh
    - name: Run tests
      run: ./run-tests.sh

  publish:
    needs: test
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Set release tags
      id: tags
      run: |
        version="${GITHUB_REF_NAME}"
        short_sha="${GITHUB_SHA}"
        short_sha="${short_sha::7}"
        echo "version_tag=$version" >> "$GITHUB_OUTPUT"
        echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push alert-monitor image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: zuva/collector/Dockerfile
        platforms: linux/amd64
        push: true
        # The image no longer contains .git, so the version is passed in.
        build-args: |
          SUNSYNK_API_CLIENT_VERSION=${{ steps.tags.outputs.version_tag }}
        tags: |
          ${{ env.DOCKERHUB_NAMESPACE }}/zuva:latest
          ${{ env.DOCKERHUB_NAMESPACE }}/zuva:${{ steps.tags.outputs.version_tag }}
          ${{ env.DOCKERHUB_NAMESPACE }}/zuva:${{ steps.tags.outputs.version_tag }}-${{ steps.tags.outputs.short_sha }}

    - name: Build and push zuva-api image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: zuva_api/Dockerfile
        platforms: linux/amd64
        push: true
        tags: |
          ${{ env.DOCKERHUB_NAMESPACE }}/zuva-api:latest
          ${{ env.DOCKERHUB_NAMESPACE }}/zuva-api:${{ steps.tags.outputs.version_tag }}
          ${{ env.DOCKERHUB_NAMESPACE }}/zuva-api:${{ steps.tags.outputs.version_tag }}-${{ steps.tags.outputs.short_sha }}
